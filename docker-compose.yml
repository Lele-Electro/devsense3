version: '3.8'

services:
  devsense-ssr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsense-ssr
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - devsense-network

networks:
  devsense-network:
    driver: bridge
