<div class="section-full mobile-page-padding p-t100 p-b70 bg-gray-light">
  <div class="container">
    <!-- TITLE START -->
    <div class="section-head-two center section-head-intro">
      <span class="section-head-label">{{ data().heading.label }}</span>
      <h2 class="sx-title-two">{{ data().heading.title }}</h2>
      <p class="section-head-lede">{{ data().heading.lede }}</p>
    </div>
    <!-- TITLE END -->
    <div class="section-content">
      <div class="row">
        @for (card of data().cards; track card.title) {
          <div class="col-lg-4 col-md-12 m-b30">
            <article class="sx-info-card">
              <span class="sx-info-card__tag">{{ card.tag }}</span>
              <h3 class="sx-info-card__title">{{ card.title }}</h3>
              @for (paragraph of card.paragraphs; track $index) {
                <p>{{ paragraph }}</p>
              }
            </article>
          </div>
        }
      </div>
    </div>
  </div>
</div>
