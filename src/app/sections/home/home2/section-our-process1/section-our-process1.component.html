<section class="process-section section-full mobile-page-padding bg-white p-t100 p-b100">
  <div class="container">
    <div class="process-heading section-head-two center">
      <span class="process-eyebrow" [innerHTML]="eyebrow"></span>
      <h2 class="sx-title-two" [innerHTML]="title"></h2>
      <div class="process-description" [innerHTML]="description"></div>
    </div>

    <div class="process-steps">
      @for (step of steps; track step.number) {
        <article class="process-step">
          <span class="process-number">{{ step.number }}</span>
          <h3 [innerHTML]="step.title"></h3>
          <div [innerHTML]="step.description"></div>
        </article>
      }
    </div>

    <div class="process-action">
      <a routerLink="/pages/contact-us" class="site-button-secondry btn-half outline">Start with discovery <span class="sx-bg-primary"></span></a>
    </div>
  </div>
</section>
