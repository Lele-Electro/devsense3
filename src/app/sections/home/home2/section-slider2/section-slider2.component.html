
<div class="sx-bnr-2-wrap-outer home-2-slider">
    <video
        muted
        autoplay
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        class="banner-video"
        (loadedmetadata)="onVideoLoadedMetadata($event)"
        (pause)="onVideoPaused($event)">
        <source src="assets/images/main-slider/slider2/banner-video2.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>
    <div class="dot-mask"></div>
    
    <!-- swiper slides -->
    <div class="swiper-wrapper">

        <!--slide 1-->
        <div class="sx-bnr-2-wrap swiper-slide">

            <div class="container ">
                <div class="sx-bnr-2-content-wrap">
                    <div class="sx-bnr-2-content">
                        @if (hero.title) {
                            <span class="sx-bnr-2-small-title" [innerHTML]="hero.badge"></span>
                            <h1 class="sx-bnr-2-large-title" [innerHTML]="hero.title"></h1>
                            <div class="sx-bnr-2-description" [innerHTML]="hero.description"></div>
                        
                            <div class="sx-bnr-readmore">
                                <a routerLink="/pages/contact-us" class="site-button btn-half m-b30" [innerHTML]="hero.cta"></a>
                            </div>
                        }
                    
                    </div>

                    
                </div>
            </div>
            <div class="sx-bnr-images" >
                <!-- <img src="assets/images/main-slider/slider2/sm-pic1.png" alt=""> -->
            </div>
            <div class="sld-bld-text-wrap">
                <h2 class="sld-bld-text">DevSense</h2>
            </div>
        </div>

        <!--slide 2-->
        <div class="sx-bnr-2-wrap swiper-slide">
            <div class="container">
                <div class="sx-bnr-2-content-wrap">
                    <div class="sx-bnr-2-content">
                        @if (secondaryHero.title) {
                            <span class="sx-bnr-2-small-title" [innerHTML]="secondaryHero.badge"></span>
                            <h2 class="sx-bnr-2-large-title" [innerHTML]="secondaryHero.title"></h2>
                            <div class="sx-bnr-2-description" [innerHTML]="secondaryHero.description"></div>

                            <div class="sx-bnr-readmore">
                                <a routerLink="/services/ai-integration-automation" class="site-button btn-half m-b30" [innerHTML]="secondaryHero.cta"></a>
                            </div>
                        }
                    </div>
                </div>
            </div>
            <div class="sld-bld-text-wrap">
                <h2 class="sld-bld-text">AI Systems</h2>
            </div>
        </div>
    </div>
    <!-- !swiper slides -->
    
     <!-- swipper controls -->
     <div class="swiper-pagination"></div>
     <!-- Add Arrows -->
     <div class="swiper-button-next"></div>
     <div class="swiper-button-prev"></div>
</div>
