<div class="section-full mobile-page-padding p-t100 p-b70 sx-bg-light">
  <div class="container">

    <div class="section-content">
      <!-- TITLE START -->
      <div class="section-head">
        <div class="sx-separator-outer separator-left">
          <div class="sx-separator" data-title="06">
            <h2 class="sep-line-one typewrite" data-period="2000" attr.data-type='[ "{{data.title}}"]' ><span class="wrap">{{data.title}}</span></h2>
          </div>
        </div>

      </div>
      <!-- TITLE END -->
      <div class="row testimonial-h-2 ">
        <div class="col-lg-5 col-md-12">
          <div class="textimonial-left-media bg-cover" style="background-image: url({{data.sectionImage}});">
          </div>
        </div>
        <div class="col-lg-7 col-md-12">
          <!-- TESTIMONIAL START -->
          <div class="owl-carousel testimonial-home bg-no-repeat bg-bottom-right" style="background-image: url(assets/images/background/r-corner.png)">

            @for (object of data.quotes; track object) {
              <div class="item">
                <div class="testimonial-2  hover-animation-1 bg-white">
                  <div class="testimonial-text ">
                    <span class="testimonial-quote sx-text-primary"><i class="flaticon-left-quote"></i></span>
                    <p>{{object.quote}}</p>
                  </div>
                  <div class="testimonial-detail clearfix">
                    <div class="testimonial-pic shadow scale-in-center"><img src="{{object.image}}" width="100" height="100" alt=""></div>
                    <div class="testimonial-user-info">
                      <h4 class="testimonial-name">{{object.name}}</h4>
                      <span class="testimonial-position">{{object.designation}}</span>
                    </div>
                  </div>
                </div>
              </div>
            }

          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hilite-title text-left p-l50 text-uppercase">
    <strong>{{data.title}}</strong>
  </div>
</div>
