<div class="comments-area" id="comments">
  <h2 class="comments-title m-b30">{{data.count}} Comments</h2>
  <div class="comments-outer">
    <!-- COMMENT LIST START -->
    <ol class="comment-list">
      @for (object of data.comments; track object) {
        <li class="comment">
          <!-- COMMENT BLOCK -->
          <app-element-commentcell [data]="object"></app-element-commentcell>
          <!-- SUB COMMENT BLOCK -->
          <ol class="children">
            @for (obj1 of object.replies; track obj1) {
              <li class="comment odd parent">
                <app-element-commentcell [data]="obj1"></app-element-commentcell>
                <ol class="children">
                  @for (obj2 of obj1.replies; track obj2) {
                    <li class="comment odd parent">
                      <app-element-commentcell [data]="obj2"></app-element-commentcell>
                    </li>
                  }
                </ol>
              </li>
            }
          </ol>
        </li>
      }
    </ol>
    <!-- COMMENT LIST END -->

    <!-- LEAVE A REPLY START -->
    <div class="comment-respond m-t30" id="respond">

      <h2 class="comment-reply-title m-b30" id="reply-title">Leave a Comments
        <small>
          <a style="display:none;" href="#" id="cancel-comment-reply-link" rel="nofollow">Cancel reply</a>
        </small>
      </h2>

      <form class="comment-form" id="commentform" method="post">

        <p class="comment-form-author">
          <label for="author">Name <span class="required">*</span></label>
          <input class="form-control" type="text" value="" name="user-comment" placeholder="Author"
            id="author">
        </p>

        <p class="comment-form-email">
          <label for="email">Email <span class="required">*</span></label>
          <input class="form-control" type="text" value="" name="email" placeholder="Email" id="email">
        </p>

        <p class="comment-form-url">
          <label for="url">Website</label>
          <input class="form-control" type="text" value="" name="url" placeholder="Website" id="url">
        </p>

        <p class="comment-form-comment">
          <label for="comment">Comment</label>
          <textarea class="form-control" rows="8" name="comment" placeholder="Comment"
          id="comment"></textarea>
        </p>

        <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent"
          name="wp-comment-cookies-consent" type="checkbox" value="yes"><label
          for="wp-comment-cookies-consent">Save my name, email, and website in this browser for the next
        time I comment.</label></p>

        <p class="form-submit">

          <button type="button" class="site-button-secondry btn-half outline m-r15">Submit <span
          class="sx-bg-primary"></span></button>
        </p>

      </form>

    </div>
    <!-- LEAVE A REPLY END -->
  </div>
</div>
