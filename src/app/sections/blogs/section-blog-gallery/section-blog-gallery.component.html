<div class="widget widget_gallery mfp-gallery">
  <h4 class="widget-title  ">Our Gallery</h4>
  <ul class="bg-white clearfix">
    @for (object of data(); track object) {
      <li>
        <div class="sx-post-thum">
          <a href="{{object.image}}" class="mfp-link" ><img src="{{object.thumb}}" alt=""></a>
        </div>
      </li>
    }
  </ul>
</div>
