@if (wpService.isLoading() || !loaderComplete()) {
  <app-loader [dataReady]="!wpService.isLoading()" (completed)="onLoaderComplete()"></app-loader>
} @else {
  <router-outlet></router-outlet>

  <!-- BUTTON TOP START -->
  <button class="scroltop"><span class="fa fa-angle-up  relative" id="btn-vibrate"></span></button>
}
