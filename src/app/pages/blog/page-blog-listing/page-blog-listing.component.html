<div class="page-wraper"> 
       	
    <!-- HEADER START -->
    <app-header1></app-header1>
    <!-- HEADER END -->
    
    <!-- CONTENT START -->
    <div class="page-content">
    
        <!-- INNER PAGE BANNER -->
        <app-banner [data]="banner"></app-banner>
        <!-- INNER PAGE BANNER END -->
        
        <!-- SECTION CONTENT START -->
        <div class="section-full p-t100 p-b70 mobile-page-padding">
            
            <!-- GALLERY CONTENT START -->
                <div class="container">
                    <div class="row">
                        <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
                            <div class="news-listing ">
                                
                                <!-- COLUMNS 2 -->
                                <div class="blog-post blog-lg date-style-3" *ngFor="let object of blogs">
                                        
                                    <div *ngIf="object.type == 'image'" 
                                        class="sx-post-media sx-img-effect rotate">
                                        <a routerLink="/blog/single"><img src="{{object.image}}" alt=""></a>
                                    </div>

                                    <div *ngIf="object.type == 'slider'" 
                                        class="sx-post-media">
                                        <!--Fade slider-->
                                        <div class="owl-carousel owl-fade-slider-one owl-btn-vertical-center owl-dots-bottom-right">
                                            <div class="item" *ngFor="let obj of object.images">
                                                <div class="aon-thum-bx">
                                                    <img src="{{obj}}" alt="">
                                                </div>
                                            </div>  
                                        </div>
                                        <!--fade slider END-->
                                    </div>

                                    <div *ngIf="object.type == 'youtube'" 
                                        class="sx-post-media sx-img-effect rotate">
                                        <div class="sx-thum-bx sx-img-overlay1 sx-img-effect yt-thum-box">
                                            <img src="{{object.thumb}}" alt="">
                                            <a href="{{object.link | safe}}" class="mfp-video play-now">
                                                <i class="icon fa fa-play"></i>
                                                <span class="ripple"></span>
                                            </a>
                                        </div>
                                    </div>

                                    <div *ngIf="object.type == 'video'" 
                                        class="sx-post-media sx-img-effect rotate">
                                        <div class="sx-thum-bx sx-img-overlay1">
                                            <img src="{{object.thumb}}" alt="">
                                            <a href="{{object.link | safe}}" class="mfp-video play-now">
                                                <i class="icon fa fa-play"></i>
                                                <span class="ripple"></span>
                                            </a>
                                        </div>
                                    </div>

                                    <div *ngIf="object.type == 'iframe'" 
                                        class="sx-post-media sx-img-effect rotate">
                                        <iframe width="560" height="315" [src]="object.link | safe"></iframe>
                                    </div>

                                    <div class="sx-post-info  bg-white">

                                        <div class="sx-post-meta ">
                                            <ul>
                                                <li class="post-date">Posted {{object.date}}</li>
                                                <li class="post-author">By<a routerLink="/blog/single">{{object.author}}</a></li>
                                                <li class="post-comment"><a routerLink="/blog/single">{{object.comments}} Comments</a> </li>
                                            </ul>
                                        </div>    

                                        <div class="sx-post-title ">
                                            <h4 class="post-title"><a routerLink="/blog/single">{{object.title}}</a></h4>
                                        </div>

                                        <div class="sx-post-text">
                                            <p>{{object.description}}</p> 
                                        </div>

                                        <div class="clearfix">
                                            <div class="sx-post-readmore pull-left">
                                                 <a routerLink="/blog/single" title="READ MORE" rel="bookmark" class="site-button-link">Read More</a>
                                            </div>

                                            <div *ngIf="object.type == 'nomedia'" class="widget_social_inks pull-right social-icons-style-one">
                                                <ul class="social-icons m-b0">
                                                    <li><a href="https://www.facebook.com/" class="fa fa-facebook"></a></li>
                                                    <li><a href="https://twitter.com/" class="fa fa-twitter"></a></li>
                                                    <li><a href="https://www.behance.net/" class="fa fa-behance"></a></li>
                                                    <li><a href="https://www.instagram.com/" class="fa fa-instagram"></a></li>
                                                </ul>
                                           </div>

                                        </div>
                                        
                                    </div>
                                    
                                </div> 
                            
                            </div>

                            <div class="text-center">
                                <ul class="pagination m-t30 m-b0">
                                    <li><a href="javascript:void();"><span class="fa fa-chevron-left"></span></a></li>
                                    <li><a href="javascript:void();">1</a></li>
                                    <li class="active"><a href="javascript:void();">2</a></li>
                                    <li><a href="javascript:void();">3</a></li>
                                    <li><a href="javascript:void();"><span class="fa fa-chevron-right"></span></a></li>
                                </ul>
                            </div>

                        </div>
                        
                        <!-- SIDE BAR START -->
                        <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 sticky_column">
                            
                            <app-section-blog-sidebar [data]="sidebar"></app-section-blog-sidebar>
    
                        </div>
                        <!-- SIDE BAR END -->    
                                                              
                    </div>
                </div>
            <!-- GALLERY CONTENT END -->
        
        </div>
        <!-- SECTION CONTENT END  -->
        
    </div>
    <!-- CONTENT END -->
    
    <!-- FOOTER START -->
    <app-footer1></app-footer1>
    <!-- FOOTER END -->

</div>
